name: Daily CWV monitor

on:
  schedule:
    - cron: "0 9 * * *" # 16:00 VN
  workflow_dispatch: {}

permissions:
  contents: write # to commit data.db back

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run monitor
        env:
          SITE_URLS: ${{ secrets.SITE_URLS }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
          # workflow_dispatch = ad-hoc manual run: report to Chat, never touch data.db
          MANUAL_TRIGGER: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py
      - name: Commit history DB
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.db
          git diff --cached --quiet || git commit -m "data: $(date -I)"
          git push
